<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A clean personal tracker for college tasks and daily streaks." />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101319" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="./favicon.png" type="image/png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- iOS ignores the manifest for these, so they are declared separately. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tracker" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Tracker</title>
    <!--gean-stage-css-->
  </head>
  <body>
    <!-- The loading screen's first frame, inlined at build time from src/lib/gean.ts. -->
    <!--gean-shell-->
    <script>
      // Safety net: if the app's code never arrives, don't leave empty letters
      // on screen forever. The app sets __geanBooted the moment it starts.
      setTimeout(function () {
        if (window.__geanBooted) return
        var center = document.querySelector('#gean-shell .gean-center')
        if (!center) return
        var note = document.createElement('div')
        note.className = 'gean-fallback'
        note.innerHTML = '<p>Couldn’t load. Check your connection, then reload.</p><button type="button">Reload</button>'
        note.querySelector('button').onclick = function () { location.reload() }
        center.appendChild(note)
      }, 20000)
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
